name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Covers unit parsing, page geometry, undo history, contour tracing and
      # the SVG/DXF/PDF writers. The canvas-backed half needs @napi-rs/canvas,
      # so fail loudly if it silently skipped instead of running.
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Assert the canvas suite actually ran
        shell: bash
        run: |
          if grep -q "SKIP @napi-rs/canvas is not installed" test-output.txt; then
            echo "::error::@napi-rs/canvas missing — the canvas tests were skipped"
            exit 1
          fi
          grep -E "^# (tests|pass|fail)" test-output.txt || echo "(no TAP summary to report)"

  syntax:
    name: module syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse every browser module
        run: |
          for f in public/js/*.js; do
            node --check "$f" || exit 1
          done
          echo "all modules parse"

  deploy-config:
    name: cloudflare config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Catches a broken wrangler.toml or a missing asset directory without
      # needing Cloudflare credentials.
      - name: Validate the Workers build
        run: npx wrangler deploy --dry-run
        env:
          CI: '1'
          WRANGLER_SEND_METRICS: 'false'
